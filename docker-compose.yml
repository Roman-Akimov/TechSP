services:
  db:
    image: postgres:16
    container_name: library_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: library_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://library:library@db:5432/library_db
      JWT_SECRET_KEY: super-secret-library-jwt-key-2026
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: library_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata: